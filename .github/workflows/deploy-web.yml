name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygbag==0.9.3
      # Package only what the game needs (the README screenshots would double the download).
      - name: Stage game files
        run: |
          mkdir -p web-src/syncronet
          cp -R Synchronet-Traffic-Simulation-with-stats/{main.py,simulation.py,images} web-src/syncronet/
      - name: Build WebAssembly version
        run: python -m pygbag --build --ume_block 0 --width 1400 --height 800 --title "SYNCRONET-AI Traffic Simulation" web-src/syncronet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-src/syncronet/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
